{% extends "base.html" %}
{% block title %}Heslo změněno – GamePanel{% endblock %}

{% block content %}
<div style="max-width:420px;margin:3rem auto;text-align:center">
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:2rem">
    <div style="font-size:2rem;margin-bottom:.75rem">✓</div>
    <h1 style="font-size:1.1rem;font-weight:700;margin-bottom:.5rem;color:var(--green)">Heslo bylo změněno</h1>
    <p style="color:var(--text-dim);font-size:13px;margin-bottom:1.25rem">
      Tvoje nové heslo je aktivní.
    </p>
    <a href="/" style="background:var(--accent);color:#fff;padding:.45rem 1rem;border-radius:var(--radius);font-size:13px;font-weight:600;text-decoration:none">
      Zpět na dashboard
    </a>
  </div>
</div>
{% endblock %}
