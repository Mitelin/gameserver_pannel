# ══════════════════════════════════════════════════
# /etc/systemd/system/gameserver-panel.target
# ══════════════════════════════════════════════════
# Spustí/zastaví všechny části panelu najednou:
#   systemctl start gameserver-panel.target
#   systemctl stop  gameserver-panel.target

[Unit]
Description=Gameserver Panel – všechny procesy
After=network.target postgresql.service redis.service

[Install]
WantedBy=multi-user.target

---

# ══════════════════════════════════════════════════
# /etc/systemd/system/gameserver-panel-web.service
# ══════════════════════════════════════════════════

[Unit]
Description=Gameserver Panel – web (uvicorn/ASGI)
After=network.target postgresql.service redis.service
PartOf=gameserver-panel.target

[Service]
User=mcpanel
Group=mcpanel
WorkingDirectory=/srv/gameserver_panel
EnvironmentFile=/srv/gameserver_panel/.env
ExecStart=/srv/gameserver_panel/.venv/bin/uvicorn config.asgi:application \
    --host 127.0.0.1 \
    --port 8000 \
    --workers 2
Restart=on-failure
RestartSec=5s
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=gameserver-panel.target

---

# ══════════════════════════════════════════════════
# /etc/systemd/system/gameserver-panel-worker.service
# ══════════════════════════════════════════════════
# Unified runtime worker (nahrazuje console-tail + metrics + watchdog)

[Unit]
Description=Gameserver Panel – runtime worker (console + metrics + watchdog)
After=gameserver-panel-web.service
PartOf=gameserver-panel.target

[Service]
User=mcpanel
Group=mcpanel
WorkingDirectory=/srv/gameserver_panel
EnvironmentFile=/srv/gameserver_panel/.env
ExecStart=/srv/gameserver_panel/.venv/bin/python manage.py run_runtime_worker
Restart=on-failure
RestartSec=5s
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=gameserver-panel.target

---

# ══════════════════════════════════════════════════
# Jak aktivovat (nová instalace):
# ══════════════════════════════════════════════════
#
# sudo systemctl daemon-reload
# sudo systemctl enable gameserver-panel.target
# sudo systemctl enable gameserver-panel-web.service
# sudo systemctl enable gameserver-panel-worker.service
# sudo systemctl start gameserver-panel.target
#
# Logy:
# journalctl -u gameserver-panel-worker.service -f
# journalctl -u gameserver-panel-web.service -f
#
# ══════════════════════════════════════════════════
# Migrace ze starého nastavení (3 oddělené služby):
# ══════════════════════════════════════════════════
#
# sudo systemctl stop  gameserver-panel-console-tail.service
# sudo systemctl stop  gameserver-panel-metrics.service
# sudo systemctl stop  gameserver-panel-watchdog.service
# sudo systemctl disable gameserver-panel-console-tail.service
# sudo systemctl disable gameserver-panel-metrics.service
# sudo systemctl disable gameserver-panel-watchdog.service
# sudo rm /etc/systemd/system/gameserver-panel-console-tail.service
# sudo rm /etc/systemd/system/gameserver-panel-metrics.service
# sudo rm /etc/systemd/system/gameserver-panel-watchdog.service
# sudo systemctl daemon-reload
# sudo systemctl enable --now gameserver-panel-worker.service
