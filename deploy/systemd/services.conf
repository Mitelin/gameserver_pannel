# ══════════════════════════════════════════════════
# /etc/systemd/system/gameserver-panel.target
# ══════════════════════════════════════════════════
# Spustí/zastaví všechny části panelu najednou:
#   systemctl start gameserver-panel.target
#   systemctl stop  gameserver-panel.target

[Unit]
Description=Gameserver Panel – všechny procesy
After=network.target postgresql.service redis.service

[Install]
WantedBy=multi-user.target

---

# ══════════════════════════════════════════════════
# /etc/systemd/system/gameserver-panel-web.service
# ══════════════════════════════════════════════════

[Unit]
Description=Gameserver Panel – web (uvicorn/ASGI)
After=network.target postgresql.service redis.service
PartOf=gameserver-panel.target

[Service]
User=mcpanel
Group=mcpanel
WorkingDirectory=/srv/gameserver_panel
EnvironmentFile=/srv/gameserver_panel/.env
ExecStart=/srv/gameserver_panel/.venv/bin/uvicorn config.asgi:application \
    --host 127.0.0.1 \
    --port 8000 \
    --workers 2
Restart=on-failure
RestartSec=5s
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=gameserver-panel.target

---

# ══════════════════════════════════════════════════
# /etc/systemd/system/gameserver-panel-console-tail.service
# ══════════════════════════════════════════════════

[Unit]
Description=Gameserver Panel – log tailer
After=gameserver-panel-web.service
PartOf=gameserver-panel.target

[Service]
User=mcpanel
Group=mcpanel
WorkingDirectory=/srv/gameserver_panel
EnvironmentFile=/srv/gameserver_panel/.env
ExecStart=/srv/gameserver_panel/.venv/bin/python manage.py run_console_tail
Restart=on-failure
RestartSec=5s
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=gameserver-panel.target

---

# ══════════════════════════════════════════════════
# /etc/systemd/system/gameserver-panel-metrics.service
# ══════════════════════════════════════════════════

[Unit]
Description=Gameserver Panel – metrics collector
After=gameserver-panel-web.service
PartOf=gameserver-panel.target

[Service]
User=mcpanel
Group=mcpanel
WorkingDirectory=/srv/gameserver_panel
EnvironmentFile=/srv/gameserver_panel/.env
ExecStart=/srv/gameserver_panel/.venv/bin/python manage.py run_metrics_collector
Restart=on-failure
RestartSec=5s
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=gameserver-panel.target

---

# ══════════════════════════════════════════════════
# /etc/systemd/system/gameserver-panel-watchdog.service
# ══════════════════════════════════════════════════

[Unit]
Description=Gameserver Panel – server watchdog + notifikace
After=gameserver-panel-web.service
PartOf=gameserver-panel.target

[Service]
User=mcpanel
Group=mcpanel
WorkingDirectory=/srv/gameserver_panel
EnvironmentFile=/srv/gameserver_panel/.env
ExecStart=/srv/gameserver_panel/.venv/bin/python manage.py run_server_watchdog
Restart=on-failure
RestartSec=5s
StandardOutput=journal
StandardError=journal

[Install]
WantedBy=gameserver-panel.target

---

# ══════════════════════════════════════════════════
# Jak aktivovat:
# ══════════════════════════════════════════════════
#
# sudo systemctl daemon-reload
# sudo systemctl enable gameserver-panel.target
# sudo systemctl enable gameserver-panel-web.service
# sudo systemctl enable gameserver-panel-console-tail.service
# sudo systemctl enable gameserver-panel-metrics.service
# sudo systemctl enable gameserver-panel-watchdog.service
# sudo systemctl start gameserver-panel.target
#
# Logy:
# journalctl -u gameserver-panel-watchdog.service -f

---

# ══════════════════════════════════════════════════
# Fáze 2 – metrics aggregator timer (volitelné)
# Alternativa k inline agregaci v run_metrics_collector
# ══════════════════════════════════════════════════

# /etc/systemd/system/gameserver-panel-aggregator.service
[Unit]
Description=Gameserver Panel – metrics aggregator (jednorázové spuštění)
After=gameserver-panel-web.service

[Service]
User=mcpanel
WorkingDirectory=/srv/gameserver_panel
EnvironmentFile=/srv/gameserver_panel/.env
ExecStart=/srv/gameserver_panel/.venv/bin/python manage.py run_metrics_aggregator --all
Type=oneshot

---

# /etc/systemd/system/gameserver-panel-aggregator.timer
[Unit]
Description=Spouští metrics aggregator každou minutu

[Timer]
OnCalendar=*:0/1
Persistent=true

[Install]
WantedBy=timers.target

---
# Aktivace:
# sudo systemctl enable --now gameserver-panel-aggregator.timer
