# /etc/nginx/sites-available/gameserver-panel
# Symlink: sudo ln -s /etc/nginx/sites-available/gameserver-panel /etc/nginx/sites-enabled/

upstream django {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;  # Nahrad svou domenou

    # HTTPS redirect (odkomentuj po nastaveni certbot)
    # return 301 https://$host$request_uri;

    # Staticke soubory
    location /static/ {
        alias /srv/gameserver_panel/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # HTTP aplikace
    location / {
        proxy_pass http://django;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # WebSocket - MUSI byt pred obecnym location /
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $http_host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;  # 24h - WS nesmi timeoutovat
        proxy_send_timeout 86400s;
    }
}

